name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build MenuStudio.csproj -c Release -o out
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/MenuStudio.exe,out/MenuStudio.exe.config -DestinationPath MenuStudio.zip -ErrorAction SilentlyContinue
          if (!(Test-Path MenuStudio.zip)) { Compress-Archive -Path out/MenuStudio.exe -DestinationPath MenuStudio.zip }
      - uses: actions/upload-artifact@v4
        with:
          name: MenuStudio
          path: |
            out/MenuStudio.exe
            MenuStudio.zip
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MenuStudio (latest build)
          files: |
            out/MenuStudio.exe
            MenuStudio.zip
